server:
  port: 8082

spring:
  application:
    name: grupos-service
  datasource:
    url: jdbc:h2:mem:gruposdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

campusstudy:
  auth:
    # Demo: Bearer <usuario_id>  (ej. Authorization: Bearer 692464)
    demo-mode: true
  clients:
    timeout-ms: 3000
    max-retries: 2
    materias-base-url: http://localhost:8083
    usuarios-base-url: http://localhost:8081
    notificaciones-base-url: http://localhost:8084
    tareas-base-url: http://localhost:8085
  stubs:
    enabled: true

logging:
  level:
    com.campusstudy.grupos: INFO
